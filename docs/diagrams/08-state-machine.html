<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiel-Phasen</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fcf8ee;
      --color-paper-2: #f4eee0;
      --color-ink:     #120c06;
      --color-muted:   #4c4438;
      --color-accent:  #a9361f;
      --color-rule:    rgba(18,12,6,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.9rem, 2.4vw + 1rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · Lemon Market</p>
    <h1>Spiel-Phasen</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lm-state-title lm-state-desc">
        <title id="lm-state-title">Spiel-Phasen von Lemon Market</title>
        <desc id="lm-state-desc">Eine Session läuft von Lobby über Seller Input und Market zu Round End, das entweder zur nächsten Runde zurück zu Seller Input oder zu Game End führt, während ein Admin jederzeit den Info-Modus umschalten oder Spieler entfernen kann.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4c4438"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9361f"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#226582"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fcf8ee"/>

        <!-- ===== Transitions (drawn before nodes) ===== -->

        <!-- Start -> Lobby -->
        <line x1="54" y1="328" x2="80" y2="328" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Lobby -> Seller Input -->
        <line x1="240" y1="328" x2="320" y2="328" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Seller Input -> Market -->
        <line x1="480" y1="328" x2="560" y2="328" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Market -> Round End -->
        <line x1="720" y1="328" x2="800" y2="328" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Round End -> Game End -->
        <line x1="960" y1="328" x2="1040" y2="328" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Round End -> Seller Input (bridge above, next round) -->
        <path d="M880,280 V196 Q880,188 872,188 H408 Q400,188 400,196 V280" fill="none" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Game End -> End ring -->
        <line x1="1200" y1="328" x2="1232" y2="328" stroke="#4c4438" stroke-width="1.2"/>

        <!-- Admin -> Market (toggle-info-mode, dashed override) -->
        <line x1="640" y1="480" x2="640" y2="376" stroke="rgba(18,12,6,0.45)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Admin -> Game End (kick player, dashed override) -->
        <path d="M740,516 H1112 Q1120,516 1120,508 V376" fill="none" stroke="rgba(18,12,6,0.45)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ===== Transition labels (masked, gap-respecting) ===== -->

        <rect x="250" y="304" width="60" height="16" rx="2" fill="#fcf8ee"/>
        <text x="280" y="316" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">/start</text>

        <rect x="490" y="304" width="60" height="16" rx="2" fill="#fcf8ee"/>
        <text x="520" y="316" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">fertig</text>

        <rect x="730" y="304" width="60" height="16" rx="2" fill="#fcf8ee"/>
        <text x="760" y="316" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">fertig</text>

        <rect x="975" y="304" width="50" height="16" rx="2" fill="#fcf8ee"/>
        <text x="1000" y="316" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">ende</text>

        <!-- 2-line label on the bridge (x400-880, y188) -->
        <rect x="566" y="142" width="140" height="38" rx="2" fill="#fcf8ee"/>
        <text x="636" y="158" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">/next-round</text>
        <text x="636" y="174" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">[Runden übrig]</text>

        <!-- Admin -> Market label, beside the vertical line -->
        <rect x="648" y="421" width="148" height="16" rx="2" fill="#fcf8ee"/>
        <text x="722" y="433" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">toggle-info-mode</text>

        <!-- Admin -> Game End label, on the horizontal run -->
        <rect x="822" y="492" width="209" height="16" rx="2" fill="#fcf8ee"/>
        <text x="926" y="504" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">kick · delete /players/:id</text>

        <!-- Start dot -->
        <circle cx="44" cy="328" r="6" fill="#120c06"/>

        <!-- End ring -->
        <circle cx="1240" cy="328" r="8" fill="none" stroke="#120c06" stroke-width="1"/>
        <circle cx="1240" cy="328" r="5" fill="#120c06"/>

        <!-- ===== States ===== -->

        <!-- Lobby -->
        <rect x="80" y="280" width="160" height="96" rx="8" fill="#ffffff" stroke="#120c06" stroke-width="1"/>
        <rect x="88" y="288" width="44" height="16" rx="2" fill="transparent" stroke="rgba(18,12,6,0.4)" stroke-width="0.8"/>
        <text x="110" y="300" fill="#120c06" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="160" y="332" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lobby</text>
        <text x="160" y="352" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">wartet auf Start</text>

        <!-- Seller Input -->
        <rect x="320" y="280" width="160" height="96" rx="8" fill="#ffffff" stroke="#120c06" stroke-width="1"/>
        <rect x="328" y="288" width="44" height="16" rx="2" fill="transparent" stroke="rgba(18,12,6,0.4)" stroke-width="0.8"/>
        <text x="350" y="300" fill="#120c06" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="400" y="332" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seller Input</text>
        <text x="400" y="352" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Preise setzen</text>

        <!-- Market (FOCAL) -->
        <rect x="560" y="280" width="160" height="96" rx="8" fill="rgba(169,54,31,0.08)" stroke="#a9361f" stroke-width="1.2"/>
        <rect x="568" y="288" width="44" height="16" rx="2" fill="transparent" stroke="rgba(169,54,31,0.6)" stroke-width="0.8"/>
        <text x="590" y="300" fill="#a9361f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="332" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Market</text>
        <text x="640" y="352" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Handel aktiv</text>

        <!-- Round End -->
        <rect x="800" y="280" width="160" height="96" rx="8" fill="#ffffff" stroke="#120c06" stroke-width="1"/>
        <rect x="808" y="288" width="44" height="16" rx="2" fill="transparent" stroke="rgba(18,12,6,0.4)" stroke-width="0.8"/>
        <text x="830" y="300" fill="#120c06" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="880" y="332" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Round End</text>
        <text x="880" y="352" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Rundenauswertung</text>

        <!-- Game End (terminal) -->
        <rect x="1040" y="280" width="160" height="96" rx="8" fill="rgba(18,12,6,0.05)" stroke="#4c4438" stroke-width="1.2"/>
        <rect x="1048" y="288" width="44" height="16" rx="2" fill="transparent" stroke="rgba(76,68,56,0.6)" stroke-width="0.8"/>
        <text x="1070" y="300" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENDE</text>
        <text x="1120" y="332" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Game End</text>
        <text x="1120" y="352" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Endzustand</text>

        <!-- Admin (optional / override source) -->
        <rect x="540" y="480" width="200" height="72" rx="6" fill="rgba(18,12,6,0.02)" stroke="rgba(18,12,6,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="548" y="488" width="40" height="16" rx="2" fill="transparent" stroke="rgba(18,12,6,0.4)" stroke-width="0.8"/>
        <text x="568" y="500" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADMIN</text>
        <text x="640" y="528" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin</text>
        <text x="640" y="544" fill="#4c4438" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">Dozent · Eingriff</text>

        <!-- ===== Annotation callout ===== -->
        <text x="40" y="600" fill="#120c06" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">In jeder Phase möglich — auch im Game End</text>
        <path d="M150,608 Q340,580 540,524" fill="none" stroke="rgba(18,12,6,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="540" cy="524" r="2" fill="#120c06"/>

        <!-- ===== Legend ===== -->
        <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(18,12,6,0.12)" stroke-width="0.8"/>

        <rect x="40" y="656" width="14" height="14" rx="3" fill="#ffffff" stroke="#120c06" stroke-width="1"/>
        <text x="62" y="667" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">STATE</text>

        <rect x="230" y="656" width="14" height="14" rx="3" fill="rgba(169,54,31,0.08)" stroke="#a9361f" stroke-width="1.2"/>
        <text x="252" y="667" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">FOKAL</text>

        <rect x="420" y="656" width="14" height="14" rx="3" fill="rgba(18,12,6,0.02)" stroke="rgba(18,12,6,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="442" y="667" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ADMIN-OVERRIDE</text>

        <circle cx="690" cy="663" r="6" fill="#120c06"/>
        <text x="706" y="667" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">START</text>

        <circle cx="830" cy="663" r="8" fill="none" stroke="#120c06" stroke-width="1"/>
        <circle cx="830" cy="663" r="5" fill="#120c06"/>
        <text x="848" y="667" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ENDE (TERMINAL)</text>
      </svg>
    </div>
  </div>
</body>
</html>
