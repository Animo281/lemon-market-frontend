<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend-Schichten · Layer Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fcf8ee;
      --color-paper-2: #f4eee0;
      --color-ink:     #120c06;
      --color-muted:   #4c4438;
      --color-soft:    #908470;
      --color-accent:  #a9361f;
      --color-link:    #226582;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer Stack · Lemon Market</p>
    <h1>Backend-Schichten</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layer-stack-title layer-stack-desc">
        <title id="layer-stack-title">Backend-Schichten</title>
        <desc id="layer-stack-desc">Schichtstapel des Express/TypeScript-Backends von routes über middleware, controllers, services und repositories bis zur fokalen mappers/toPublic-Schicht, die Admin- und Spieler-Tokens vor dem Versand entfernt.</desc>

        <rect width="100%" height="100%" fill="#fcf8ee"/>

        <!-- Direction column (left margin) -->
        <text x="60" y="68" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ANFRAGE</text>
        <line x1="80" y1="80" x2="80" y2="464" stroke="rgba(18,12,6,0.30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#4c4438"/>
        <text x="60" y="480" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DATEN</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>
        <line x1="120" y1="464" x2="960" y2="464" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>

        <!-- L1 — routes/ -->
        <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>
        <text x="140" y="116" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="260" y="118" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif">routes/</text>
        <text x="940" y="118" fill="#4c4438" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">nur HTTP-Wiring</text>

        <!-- L2 — middleware/ -->
        <rect x="120" y="144" width="840" height="64" fill="#fcf8ee"/>
        <line x1="120" y1="208" x2="960" y2="208" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>
        <text x="140" y="180" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="182" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif">middleware/</text>
        <text x="940" y="182" fill="#4c4438" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">loadSession, requireAdmin, validate</text>

        <!-- L3 — controllers/ -->
        <rect x="120" y="208" width="840" height="64" fill="#f4eee0"/>
        <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>
        <text x="140" y="244" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="246" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif">controllers/</text>
        <text x="940" y="246" fill="#4c4438" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">request → service → response</text>

        <!-- L4 — services/ -->
        <rect x="120" y="272" width="840" height="64" fill="#f4eee0"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>
        <text x="140" y="308" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
        <text x="260" y="310" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif">services/</text>
        <text x="940" y="310" fill="#4c4438" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">state machine, gameAnalytics, gameLogic</text>

        <!-- L5 — repositories/ -->
        <rect x="120" y="336" width="840" height="64" fill="#eee4cf"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(18,12,6,0.12)" stroke-width="1"/>
        <text x="140" y="372" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
        <text x="260" y="374" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif">repositories/</text>
        <text x="940" y="374" fill="#4c4438" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">in-memory Map, injectable</text>

        <!-- L6 — mappers/ (FOCAL — coral tint + coral stroke) -->
        <rect x="120" y="400" width="840" height="64" fill="rgba(169,54,31,0.08)"/>
        <rect x="120" y="400" width="840" height="64" fill="none" stroke="#a9361f" stroke-width="1.4" stroke-dasharray="4,4"/>
        <text x="140" y="436" fill="#a9361f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L6</text>
        <text x="260" y="438" fill="#120c06" font-size="16" font-weight="600" font-family="'Geist', sans-serif">mappers/</text>
        <text x="940" y="438" fill="#a9361f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">toPublic() — entfernt Tokens</text>

        <!-- Caption -->
        <text x="120" y="508" fill="#a9361f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOKALE SCHICHT</text>
        <text x="258" y="508" fill="#4c4438" font-size="8.5" font-family="'Instrument Serif', serif" font-style="italic">toPublic() entfernt adminToken und die Tokens anderer Spieler, bevor eine Antwort das Backend verlässt — die letzte Schranke gegen Token-Leaks.</text>
      </svg>
    </div>
  </div>
</body>
</html>
