<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beitreten &amp; Entscheidung · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fcf8ee;
      --color-paper-2: #f4eee0;
      --color-ink:     #120c06;
      --color-muted:   #4c4438;
      --color-soft:    #908470;
      --color-accent:  #a9361f;
      --color-link:    #226582;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Lemon Market</p>
    <h1>Beitreten &amp; Entscheidung</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="join-sequence-title join-sequence-desc">
        <title id="join-sequence-title">Beitreten &amp; Entscheidung</title>
        <desc id="join-sequence-desc">Sequenzdiagramm: ein Spieler tritt einer Session bei, erhält einen Token, und schickt anschließend seine Entscheidung mit diesem Token im x-token-Header an die Worker-API, die ihn gegen die SessionDurableObject validiert.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4c4438"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a9361f"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#226582"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#fcf8ee"/>

        <!-- =================================================================
             LIFELINES — dashed, behind everything. Centers: 160 (Spieler),
             500 (Worker/API), 840 (SessionDurableObject).
             ================================================================= -->
        <line x1="160" y1="128" x2="160" y2="560" stroke="rgba(18,12,6,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="500" y1="128" x2="500" y2="560" stroke="rgba(18,12,6,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="128" x2="840" y2="560" stroke="rgba(18,12,6,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ACTIVATION BARS — drawn before message arrows.
             API: two spans (join cycle, decision cycle).
             DO: two short spans nested inside the API spans.
             ================================================================= -->
        <rect x="496" y="176" width="8" height="144" fill="rgba(18,12,6,0.06)" stroke="#4c4438" stroke-width="0.8"/>
        <rect x="836" y="224" width="8" height="48" fill="rgba(18,12,6,0.06)" stroke="#4c4438" stroke-width="0.8"/>
        <rect x="496" y="392" width="8" height="144" fill="rgba(18,12,6,0.06)" stroke="#4c4438" stroke-width="0.8"/>
        <rect x="836" y="440" width="8" height="48" fill="rgba(18,12,6,0.06)" stroke="#4c4438" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGES — time flows top→down. Drawn before labels/actors.
             ================================================================= -->

        <!-- M1: Spieler → API  (HTTP call · link-blue) -->
        <line x1="160" y1="176" x2="500" y2="176" stroke="#226582" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M2: API → SessionDurableObject  (internal call · muted) -->
        <line x1="500" y1="224" x2="840" y2="224" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M3: SessionDurableObject → API  (return · muted dashed) -->
        <line x1="840" y1="272" x2="504" y2="272" stroke="#4c4438" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M4: API → Spieler  (HTTP return · link-blue dashed) -->
        <line x1="500" y1="320" x2="164" y2="320" stroke="#226582" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

        <!-- M5: Spieler → API  (FOCAL — auth-tragender Call · coral) -->
        <line x1="160" y1="392" x2="500" y2="392" stroke="#a9361f" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <!-- M6: API → SessionDurableObject  (internal call · muted) -->
        <line x1="500" y1="440" x2="840" y2="440" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M7: SessionDurableObject → API  (return · muted dashed) -->
        <line x1="840" y1="488" x2="504" y2="488" stroke="#4c4438" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M8: API → Spieler  (HTTP return · link-blue dashed) -->
        <line x1="500" y1="536" x2="164" y2="536" stroke="#226582" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

        <!-- =================================================================
             LABELS — each with an opaque paper mask, 8px gap to its stroke.
             ================================================================= -->

        <!-- M1 -->
        <rect x="272" y="156" width="116" height="12" rx="2" fill="#fcf8ee"/>
        <text x="330" y="166" fill="#226582" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST .../JOIN {ROLE}</text>

        <!-- M2 -->
        <rect x="598" y="204" width="144" height="12" rx="2" fill="#fcf8ee"/>
        <text x="670" y="214" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REGISTER + TOKEN ERZEUGEN</text>

        <!-- M3 -->
        <rect x="598" y="252" width="144" height="12" rx="2" fill="#fcf8ee"/>
        <text x="670" y="262" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">{ PLAYERTOKEN, PLAYERID }</text>

        <!-- M4 -->
        <rect x="276" y="300" width="108" height="12" rx="2" fill="#fcf8ee"/>
        <text x="330" y="310" fill="#226582" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 · PLAYERTOKEN</text>

        <!-- M5 (focal, two-line: header above path) -->
        <rect x="266" y="356" width="128" height="12" rx="2" fill="#fcf8ee"/>
        <text x="330" y="366" fill="#a9361f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em" font-weight="600">X-TOKEN: &lt;PLAYERTOKEN&gt;</text>
        <rect x="262" y="372" width="136" height="12" rx="2" fill="#fcf8ee"/>
        <text x="330" y="382" fill="#a9361f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST .../SELLER-DECISION</text>

        <!-- M6 -->
        <rect x="594" y="420" width="152" height="12" rx="2" fill="#fcf8ee"/>
        <text x="670" y="430" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VALIDATE (ZOD) + TRANSITION</text>

        <!-- M7 -->
        <rect x="608" y="468" width="124" height="12" rx="2" fill="#fcf8ee"/>
        <text x="670" y="478" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UPDATED SESSION-STATE</text>

        <!-- M8 -->
        <rect x="282" y="516" width="96" height="12" rx="2" fill="#fcf8ee"/>
        <text x="330" y="526" fill="#226582" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 · TOPUBLIC()</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows/labels so the box fill
             covers the lifeline inside its own header area.
             ================================================================= -->

        <!-- Spieler (Browser) — input treatment -->
        <rect x="85" y="72" width="150" height="56" rx="6" fill="#fcf8ee"/>
        <rect x="85" y="72" width="150" height="56" rx="6" fill="rgba(76,68,56,0.10)" stroke="#908470" stroke-width="1"/>
        <rect x="93" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(144,132,112,0.45)" stroke-width="0.8"/>
        <text x="113" y="89" fill="#908470" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="160" y="104" fill="#120c06" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spieler</text>
        <text x="160" y="119" fill="#4c4438" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Worker / API — backend treatment -->
        <rect x="415" y="72" width="170" height="56" rx="6" fill="#fcf8ee"/>
        <rect x="415" y="72" width="170" height="56" rx="6" fill="#ffffff" stroke="#120c06" stroke-width="1"/>
        <rect x="423" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,12,6,0.30)" stroke-width="0.8"/>
        <text x="437" y="89" fill="#908470" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="500" y="104" fill="#120c06" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker / API</text>
        <text x="500" y="119" fill="#4c4438" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Express · TS · CF Worker</text>

        <!-- SessionDurableObject — store treatment -->
        <rect x="730" y="72" width="220" height="56" rx="6" fill="#fcf8ee"/>
        <rect x="730" y="72" width="220" height="56" rx="6" fill="rgba(18,12,6,0.05)" stroke="#4c4438" stroke-width="1"/>
        <rect x="738" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(76,68,56,0.40)" stroke-width="0.8"/>
        <text x="750" y="89" fill="#908470" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DO</text>
        <text x="840" y="104" fill="#120c06" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SessionDurableObject</text>
        <text x="840" y="119" fill="#4c4438" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Durable Object · State</text>

        <!-- =================================================================
             LEGEND — horizontal strip.
             ================================================================= -->
        <line x1="85" y1="580" x2="950" y2="580" stroke="rgba(18,12,6,0.10)" stroke-width="0.8"/>
        <text x="85" y="596" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="85" y1="618" x2="113" y2="618" stroke="#226582" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="121" y="621" fill="#4c4438" font-size="8.5" font-family="'Geist', sans-serif">HTTP-Call (Spieler ↔ API)</text>

        <line x1="320" y1="618" x2="348" y2="618" stroke="#4c4438" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="356" y="621" fill="#4c4438" font-size="8.5" font-family="'Geist', sans-serif">Interner Call (API ↔ DO)</text>

        <line x1="560" y1="618" x2="588" y2="618" stroke="#4c4438" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="596" y="621" fill="#4c4438" font-size="8.5" font-family="'Geist', sans-serif">Return (gestrichelt)</text>

        <line x1="770" y1="618" x2="798" y2="618" stroke="#a9361f" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="806" y="621" fill="#4c4438" font-size="8.5" font-family="'Geist', sans-serif">Auth-Pflicht (x-token)</text>

        <!-- Caption -->
        <text x="85" y="658" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SICHERHEIT</text>
        <text x="200" y="658" fill="#4c4438" font-size="8.5" font-family="'Instrument Serif', serif" font-style="italic">playerToken ≠ playerId — der Token ist das einzige Auth-Mittel; Antworten maskieren fremde Tokens über toPublic().</text>
      </svg>
    </div>
  </div>
</body>
</html>
