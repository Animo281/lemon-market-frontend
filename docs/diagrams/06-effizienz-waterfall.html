<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effizienz-Waterfall · Lemon Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #fcf8ee;
      --color-paper-2:     #f4eee0;
      --color-ink:         #120c06;
      --color-ink-strong:  #111111;
      --color-muted:       #4c4438;
      --color-soft:        #908470;
      --color-rule:        rgba(18,12,6,0.12);
      --color-rule-solid:  #dad0be;
      --color-accent:      #a9361f;
      --color-accent-tint: rgba(169,54,31,0.08);
      --color-link:        #226582;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.6vw + 1rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink-strong);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · Lemon Market</p>
    <h1>Wohin der Surplus verschwindet</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waterfall-title waterfall-desc">
        <title id="waterfall-title">Wohin der Surplus verschwindet</title>
        <desc id="waterfall-desc">Waterfall-Diagramm einer Beispielrunde: vom theoretischen Effizienzmaximum über Verluste durch verdeckte Qualität und ausgestiegene Top-Verkäufer zum tatsächlich erzielten Surplus bei rund 40 Prozent Effizienz.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4c4438"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9361f"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#226582"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fcf8ee"/>

        <!-- Didactic framing badge -->
        <rect x="100" y="56" width="248" height="20" rx="2" fill="none" stroke="rgba(18,12,6,0.20)" stroke-width="0.8"/>
        <text x="112" y="70" fill="#908470" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">BEISPIELRUNDE · ILLUSTRATIV</text>

        <!-- Gridlines (drawn first, behind bars) -->
        <line x1="100" y1="100" x2="1220" y2="100" stroke="rgba(18,12,6,0.08)" stroke-width="0.8"/>
        <line x1="100" y1="330" x2="1220" y2="330" stroke="rgba(18,12,6,0.08)" stroke-width="0.8"/>
        <line x1="100" y1="560" x2="1220" y2="560" stroke="rgba(18,12,6,0.08)" stroke-width="0.8"/>

        <!-- Y axis -->
        <line x1="100" y1="100" x2="100" y2="560" stroke="rgba(18,12,6,0.25)" stroke-width="1"/>
        <text x="92" y="104" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">100%</text>
        <text x="92" y="334" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">50%</text>
        <text x="92" y="564" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0%</text>
        <text x="60" y="90" fill="#908470" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">% V. MAX.</text>

        <!-- Carries (running total crossing each gap) -->
        <line x1="430" y1="100" x2="530" y2="100" stroke="rgba(18,12,6,0.55)" stroke-width="1" data-carry="100"/>
        <line x1="670" y1="307" x2="770" y2="307" stroke="rgba(18,12,6,0.55)" stroke-width="1" data-carry="55"/>
        <line x1="910" y1="376" x2="1010" y2="376" stroke="rgba(18,12,6,0.55)" stroke-width="1" data-carry="40"/>

        <!-- Bar 1: Start total — Theoretisches Maximum (100) -->
        <rect x="290" y="100" width="140" height="460" fill="#fcf8ee"/>
        <rect x="290" y="100" width="140" height="460" fill="rgba(18,12,6,0.08)" stroke="#120c06" stroke-width="1"
              data-role="total" data-value="100" data-name="Theoretisches Maximum"/>
        <text x="360" y="88" fill="#120c06" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">100%</text>
        <text x="360" y="588" fill="#120c06" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Theoretisches Maximum</text>
        <text x="360" y="604" fill="#908470" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">theoreticalMaxSurplus</text>

        <!-- Bar 2: Delta — Verlust durch verdeckte Qualität (-45, focal) -->
        <rect x="530" y="100" width="140" height="207" fill="#fcf8ee"/>
        <rect x="530" y="100" width="140" height="207" fill="rgba(169,54,31,0.12)" stroke="#a9361f" stroke-width="1.4"
              data-role="delta" data-value="-45" data-name="Verdeckte Qualität"/>
        <text x="600" y="323" fill="#a9361f" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-45%</text>
        <text x="600" y="588" fill="#120c06" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verdeckte Qualität</text>
        <text x="600" y="604" fill="#908470" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">adverse selection</text>

        <!-- Bar 3: Delta — Ausgestiegene Top-Verkäufer (-15) -->
        <rect x="770" y="307" width="140" height="69" fill="#fcf8ee"/>
        <rect x="770" y="307" width="140" height="69" fill="#fcf8ee" stroke="#4c4438" stroke-width="1"
              data-role="delta" data-value="-15" data-name="Ausgestiegene Top-Verkäufer"/>
        <text x="840" y="392" fill="#4c4438" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">-15%</text>
        <text x="840" y="588" fill="#120c06" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ausgestiegene Top-</text>
        <text x="840" y="602" fill="#120c06" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verkäufer</text>
        <text x="840" y="618" fill="#908470" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grade 3 verlässt Markt</text>

        <!-- Bar 4: End total — Tatsächlicher Surplus (40) -->
        <rect x="1010" y="376" width="140" height="184" fill="#fcf8ee"/>
        <rect x="1010" y="376" width="140" height="184" fill="rgba(18,12,6,0.08)" stroke="#120c06" stroke-width="1"
              data-role="total" data-value="40" data-name="Tatsächlicher Surplus"/>
        <text x="1080" y="364" fill="#120c06" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">40%</text>
        <text x="1080" y="588" fill="#120c06" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tatsächlicher Surplus</text>
        <text x="1080" y="604" fill="#908470" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">totalSurplus</text>

        <!-- Annotation callout (editorial aside, top-right margin) -->
        <text x="1220" y="70" fill="#120c06" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Effizienz = totalSurplus ÷ theoreticalMaxSurplus ≈ 40 %</text>
        <path d="M 1160 80 Q 1140 160 1100 340" fill="none" stroke="rgba(18,12,6,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1100" cy="340" r="2" fill="#120c06"/>

        <!-- ============ LEGEND ============ -->
        <line x1="100" y1="640" x2="1220" y2="640" stroke="rgba(18,12,6,0.10)" stroke-width="0.8"/>
        <text x="100" y="660" fill="#4c4438" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDE</text>

        <rect x="100" y="674" width="14" height="10" rx="2" fill="rgba(18,12,6,0.08)" stroke="#120c06" stroke-width="1"/>
        <text x="120" y="682" fill="#4c4438" font-size="10.5" font-family="'Geist', sans-serif">Gesamtsumme</text>

        <rect x="300" y="674" width="14" height="10" rx="2" fill="#fcf8ee" stroke="#4c4438" stroke-width="1"/>
        <text x="320" y="682" fill="#4c4438" font-size="10.5" font-family="'Geist', sans-serif">Verlust</text>

        <rect x="440" y="674" width="14" height="10" rx="2" fill="rgba(169,54,31,0.12)" stroke="#a9361f" stroke-width="1.4"/>
        <text x="460" y="682" fill="#4c4438" font-size="10.5" font-family="'Geist', sans-serif">Größter Verlusttreiber</text>

        <line x1="700" y1="679" x2="728" y2="679" stroke="rgba(18,12,6,0.55)" stroke-width="1"/>
        <text x="736" y="682" fill="#4c4438" font-size="10.5" font-family="'Geist', sans-serif">Laufende Summe (Carry)</text>
      </svg>
    </div>
  </div>
</body>
</html>
