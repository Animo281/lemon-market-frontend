<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon Market – Verkäuferansicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E4DACA; --panel:#F4ECDD; --text:#2B1B12; --muted:#6E5646; --line:#2B1B12;
  --sky:#4D7AA1; --ink:#2B1B12; --paper:#F1E4CE; --lemonade:#DCCC62; --chalk:#2E3631; --chalkText:#F3EEE2;
  --wood:#8B5A2B; --woodL:#C98B4B; --woodD:#6B4226; --frame:#7A4A2A;
  --lemon:#F4C542; --stamp:#A8261C; --good:#2F5E12; --bad:#8E2A14; --focus:#1F5F99;
  --hand:'Patrick Hand','Comic Neue','Segoe Print',system-ui,sans-serif;
  --caps:'Patrick Hand SC','Patrick Hand',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#1B2230; --panel:#26303F; --text:#F1E4CE; --muted:#B9AE9C; --line:#56627A; --focus:#9CC8F0; }
}
:root[data-theme="dark"]{ --page:#1B2230; --panel:#26303F; --text:#F1E4CE; --muted:#B9AE9C; --line:#56627A; --focus:#9CC8F0; }

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--hand)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 40px}
.scroller{overflow-x:auto;border-radius:16px;border:3px solid var(--ink)}
.world{min-width:880px;container-type:inline-size;background:var(--sky)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:1cqw;padding:1.2cqw 1.6cqw 1cqw;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7cqw;font-family:var(--caps);font-size:2.9cqw;color:var(--paper);line-height:1}
.brand svg{width:3.4cqw;height:3.4cqw}
.pills{display:flex;gap:.7cqw;align-items:center}
.pill{background:var(--paper);color:var(--ink);border:.22cqw solid var(--ink);border-radius:.5cqw;padding:.2cqw 1cqw;font-size:1.7cqw;white-space:nowrap;display:inline-flex;gap:.45cqw;align-items:center;line-height:1.3}
.pill .v{font-size:2cqw}
.pill.role{background:var(--lemonade)}
.pill.p1{background:#D9E8B8}.pill.p2{background:#F6D98C}
.pill svg{width:1.6cqw;height:1.6cqw}
.pill.bump{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.12)}}

/* Bühne */
.stage{position:relative;aspect-ratio:1024/572;overflow:hidden;border-top:.22cqw solid var(--ink)}
.bg{position:absolute;inset:-3%;background-image:var(--scene);background-repeat:no-repeat}
.abs{position:absolute}
.sign{background:var(--paper);color:var(--ink);border:.24cqw solid var(--ink);border-radius:.4cqw;text-align:center;padding:.3cqw 2cqw .5cqw}
.sign h1{margin:0;font-family:var(--caps);font-weight:400;font-size:3.4cqw;line-height:1.1;white-space:nowrap}
.sign p{margin:0;font-size:1.6cqw;color:var(--muted)}
.cta{font-family:var(--caps);font-size:2.4cqw;line-height:1.2;color:var(--ink);background:var(--lemon);border:.25cqw solid var(--ink);border-radius:.6cqw;padding:.3cqw 2.4cqw .45cqw;cursor:pointer;box-shadow:0 .35cqw 0 var(--ink);white-space:nowrap}
.cta:hover{background:#FFD65C}
.cta:active{transform:translateY(.3cqw);box-shadow:0 .05cqw 0 var(--ink)}
.cta[aria-disabled="true"]{background:#CFC4B2;color:#5A4A3C;box-shadow:none;cursor:default;transform:none}

/* Screen 1 – Stand wählen */
.stalls{left:4%;right:4%;top:23%;display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw}
.stallcard{background:var(--paper);border:.24cqw solid var(--ink);border-radius:.8cqw;padding:.6cqw .6cqw .5cqw;cursor:pointer;color:var(--ink);text-align:center;transition:transform .15s ease}
.stallcard:hover{transform:translateY(-.4cqw)}
.stallcard .crop svg{width:2.6cqw;height:2.6cqw;display:block}
.stallcard .crop{aspect-ratio:206/250;border-radius:.4cqw;border:.2cqw solid var(--ink);background-image:var(--scene);background-repeat:no-repeat}
.stallcard b{display:block;font-family:var(--caps);font-weight:400;font-size:2.1cqw;margin-top:.3cqw;line-height:1.1}
.stallcard span{display:block;font-size:1.4cqw;color:var(--muted)}
.stallcard[aria-pressed="true"]{background:var(--lemonade);transform:translateY(-.6cqw);outline:.35cqw solid var(--lemon);outline-offset:.2cqw}
.stallcard[aria-pressed="true"] span{color:#4A4214}
.stallcard.taken{cursor:not-allowed;background:#CFC4B2}
.stallcard.taken .crop{filter:grayscale(1) brightness(.6)}
.stallcard.taken:hover{transform:none}

/* Screen 2 – Kiste wählen */
.table{left:5%;right:5%;top:74%;height:4.5%;background:#A56D38;border:.24cqw solid var(--ink);border-radius:.3cqw}
.crates{left:8%;right:8%;top:25%;display:grid;grid-template-columns:repeat(3,1fr);gap:4cqw;align-items:end}
.crateopt{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.8cqw;color:var(--ink);transition:transform .2s ease}
.crateopt .label{background:var(--paper);border:.22cqw solid var(--ink);border-radius:.3cqw;padding:.3cqw 1.2cqw .5cqw;min-width:17cqw;line-height:1.15}
.crateopt .label b{display:block;font-family:var(--caps);font-weight:400;font-size:2.3cqw}
.crateopt .label span{display:block;font-size:1.5cqw;color:var(--muted)}
.crateopt .label .cost{margin-top:.3cqw;font-family:var(--caps);font-size:1.9cqw;color:var(--ink)}
.crateopt img{width:19cqw;display:block}
.crateopt:hover{transform:translateY(-.5cqw)}
.crateopt[aria-pressed="true"]{transform:translateY(-1.4cqw)}
.crateopt[aria-pressed="true"] .label{background:var(--lemonade)}
.crateopt .pick{font-family:var(--caps);font-size:1.6cqw;background:var(--ink);color:var(--paper);border-radius:.3cqw;padding:0 .8cqw;visibility:hidden}
.crateopt[aria-pressed="true"] .pick{visibility:visible}
.q1{color:var(--good)}.q2{color:#7A5A06}.q3{color:var(--bad)}
.hint{display:flex;align-items:center;gap:.8cqw;background:var(--chalk);color:var(--chalkText);border:.35cqw solid var(--frame);border-radius:.4cqw;padding:.4cqw 1.4cqw;font-size:1.6cqw}
.hint svg{width:2.2cqw;height:2.2cqw;flex:none}

/* Screen 3 – Hinter der Theke */
.chalkboard{background:var(--chalk);color:var(--chalkText);border:.9cqw solid var(--frame);border-radius:.6cqw;padding:1cqw 1.4cqw}
.chalkboard h2{margin:0 0 .4cqw;font-family:var(--caps);font-weight:400;font-size:2.3cqw;line-height:1.1}
.chalkboard .sub{font-size:1.35cqw;color:#BDB6A6;margin:0 0 .6cqw}
.nail::before,.nail::after{content:"";position:absolute;top:-.55cqw;width:.9cqw;height:.9cqw;border-radius:50%;background:#B9B2A5;border:.15cqw solid var(--ink)}
.nail::before{left:1cqw}.nail::after{right:1cqw}

.board-market{left:2.2%;top:4%;width:24%;transform:rotate(-1.5deg)}
.mrow{display:flex;align-items:center;gap:.8cqw;font-size:1.7cqw;padding:.25cqw 0;border-bottom:.12cqw dashed rgba(243,238,226,.25)}
.mrow img{width:3.6cqw}
.mrow .avg{margin-left:auto;font-family:var(--caps);font-size:2.2cqw}
.mfoot{margin-top:.6cqw;font-size:1.4cqw;color:#BDB6A6}

.board-price{left:50%;top:5%;width:35%;transform:translateX(-50%);text-align:center}
.pricewrap{display:flex;align-items:baseline;justify-content:center;gap:.4cqw;margin:.2cqw 0 .6cqw}
.pricewrap input{width:2.3ch;background:transparent;border:0;border-bottom:.22cqw dashed #8E978F;color:var(--chalkText);font-family:var(--caps);font-size:7cqw;line-height:1;text-align:center;padding:0;-moz-appearance:textfield}
.pricewrap input::-webkit-outer-spin-button,.pricewrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pricewrap .eur{font-family:var(--caps);font-size:4.4cqw}
.pegs{display:flex;justify-content:center;gap:.8cqw}
.peg{font-family:var(--caps);font-size:2cqw;min-width:5.2cqw;color:var(--ink);background:var(--woodL);border:.22cqw solid var(--ink);border-radius:.5cqw;padding:.1cqw .6cqw .2cqw;cursor:pointer;box-shadow:0 .3cqw 0 var(--ink)}
.peg:hover{background:#D99B5B}
.peg:active{transform:translateY(.25cqw);box-shadow:0 .05cqw 0 var(--ink)}
.warn{margin-top:.6cqw;font-size:1.5cqw;color:#F4A58A;min-height:2cqw}

.ledger{right:2.2%;top:4%;width:28%;transform:rotate(1.4deg);background-color:#FBF6EA;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(2.3cqw - 1px),#C9D7E4 calc(2.3cqw - 1px) 2.3cqw);
  background-position:0 3.6cqw;border:.22cqw solid var(--ink);border-radius:.3cqw;padding:.5cqw 1.2cqw 1cqw 3.2cqw;color:var(--ink);font-size:1.5cqw;line-height:2.3cqw}
.ledger::before{content:"";position:absolute;left:2.2cqw;top:0;bottom:0;width:.15cqw;background:#E3A4A4}
.ledger h2{margin:0;font-family:var(--caps);font-weight:400;font-size:2.2cqw;line-height:3.2cqw}
.lrow{display:flex;justify-content:space-between;gap:1cqw}
.lrow b{font-weight:400;font-family:var(--caps);font-size:1.7cqw}
.lrow.total b{font-size:2cqw}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ledger h3{margin:.3cqw 0 0;font-family:var(--caps);font-weight:400;font-size:1.6cqw;color:var(--muted)}
.hist{display:grid;grid-template-columns:auto auto auto 1fr;column-gap:1cqw;font-size:1.35cqw}
.hist span:nth-child(4n){text-align:right}

.counter{left:0;right:0;bottom:0;height:29%}
.counter svg{width:100%;height:100%;display:block}
.crate-on{left:6%;bottom:26.5%;width:15%}
.crate-on img{width:100%;display:block}
.crate-on .tag{position:absolute;left:50%;top:-1.8cqw;transform:translateX(-50%) rotate(-3deg);background:var(--paper);border:.18cqw solid var(--ink);border-radius:.3cqw;padding:0 .8cqw;font-family:var(--caps);font-size:1.5cqw;white-space:nowrap}
.preview{left:24%;bottom:6%;width:23%}
.preview small{display:block;color:var(--paper);font-size:1.35cqw;margin-bottom:.3cqw;text-shadow:0 .1cqw 0 var(--ink)}
.cashbox{right:5%;bottom:26%;width:12%}
.cashbox svg{width:100%;display:block}
.hang{left:62%;bottom:9%;transform:translateX(-50%)}

/* Angebotskarte (wie Käuferansicht) */
.offer{display:inline-flex;align-items:center;gap:.6cqw;background:var(--paper);border:.24cqw solid var(--ink);border-radius:.5cqw;padding:.35cqw .8cqw .35cqw .5cqw;color:var(--ink);white-space:nowrap}
.offer.chalk{background:var(--chalk);color:var(--chalkText);border-color:#5A3A22;border-width:.45cqw}
.offer .price{font-family:var(--caps);font-size:2.7cqw;line-height:1}
.crate{position:relative;width:4cqw;aspect-ratio:70/53;flex:none}
.crate img{width:100%;height:100%;display:block}
.crate svg{position:absolute;inset:-6% -4% 20% -4%;width:108%;height:86%}
.qtext{display:block;font-family:var(--caps);font-size:1.35cqw;line-height:1.15}
.offer.chalk .q1{color:#B9E28A}.offer.chalk .q2{color:#F4D46A}.offer.chalk .q3{color:#F4A58A}
.qunknown{color:inherit}

/* Screen 4 – Kaufrunde */
.name{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);border:.2cqw solid var(--ink);border-radius:.3cqw;color:var(--ink);transform:rotate(var(--r));line-height:1;z-index:3}
.name small{font-size:1.15cqw;color:#6E5646}
.name b{font-weight:400;font-family:var(--caps);font-size:2.4cqw}
.name.lemonade{background:var(--lemonade);flex-direction:row;gap:.6cqw}
.name.lemonade b{font-size:2cqw}
.name.me{background:var(--lemon)}
.pos-offer{transform:translate(-50%,-50%) rotate(var(--r));z-index:4}
.cover-lemon{z-index:3;transform:translate(-50%,-50%)}
.cover-lemon svg{width:2.4cqw;height:2.4cqw;display:block}
.metag{transform:translate(-50%,-100%);z-index:5;background:var(--lemon);color:var(--ink);border:.22cqw solid var(--ink);border-radius:.4cqw;padding:0 1cqw;font-family:var(--caps);font-size:1.7cqw;white-space:nowrap}
.metag::after{content:"";position:absolute;left:50%;bottom:-1cqw;transform:translateX(-50%);border:.6cqw solid transparent;border-top-color:var(--ink)}
.chip{transform:translateX(-50%);z-index:5;background:var(--paper);color:var(--ink);border:.22cqw solid var(--ink);border-radius:.5cqw;padding:.15cqw 1.4cqw .3cqw;font-family:var(--caps);font-size:1.9cqw;white-space:nowrap}
.chip.me{background:var(--lemon)}
.chip.sold{background:#C9DFA2;color:#23460C}
.chip.unsold{background:#CFC4B2;color:#5A4A3C}
.chip .dots::after{content:"…"}
@media (prefers-reduced-motion: no-preference){ .chip .dots{animation:blink 1.4s steps(2) infinite} }
@keyframes blink{50%{opacity:.3}}
.ribbon{left:50%;top:2.5%;transform:translateX(-50%);z-index:6;background:var(--chalk);color:var(--chalkText);border:.35cqw solid var(--frame);border-radius:.4cqw;padding:.2cqw 1.8cqw .35cqw;font-size:1.8cqw;white-space:nowrap;display:flex;align-items:center;gap:.8cqw}
.ribbon svg{width:2.2cqw;height:2.2cqw}
.stamp{transform:translate(-50%,-50%) rotate(-11deg);border:.35cqw solid var(--stamp);color:var(--stamp);background:rgba(241,228,206,.92);border-radius:.6cqw;padding:0 1.2cqw;font-family:var(--caps);font-size:2.5cqw;z-index:7;pointer-events:none;line-height:1.3}
.stamp.gray{border-color:#5A4A3C;color:#5A4A3C}
.stamp.good{border-color:#2F6B1A;color:#2F6B1A}
.toast{left:50%;top:12%;transform:translateX(-50%);z-index:8;background:var(--paper);border:.24cqw solid var(--ink);border-radius:.5cqw;padding:.3cqw 2cqw .5cqw;font-size:2cqw;color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion: no-preference){
  .stamp.fresh{animation:press .3s cubic-bezier(.3,1.6,.5,1)}
  @keyframes press{from{transform:translate(-50%,-50%) rotate(-11deg) scale(1.9);opacity:0}to{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:1}}
  .toast{animation:drop .35s ease-out}
  @keyframes drop{from{transform:translate(-50%,-60%);opacity:0}}
}
.coin{position:fixed;width:22px;height:22px;z-index:50;pointer-events:none}

/* Mockup-Steuerung */
.controls{margin-top:18px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;font-size:18px}
.controls h2{margin:0;font-family:var(--caps);font-weight:400;font-size:22px}
.controls small{display:block;color:var(--muted);font-size:15px}
.group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;padding:3px 12px;border:0;background:transparent;color:var(--text);cursor:pointer}
.seg button + button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--lemon);color:#2B1B12}
.ctl{font:inherit;padding:3px 14px;border:2px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="scroller">
    <div class="world">
      <header class="hud">
        <div class="brand">
          <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="23" rx="13" ry="10" fill="#F4C542" stroke="#2B1B12" stroke-width="2.4"/><ellipse cx="6.5" cy="23" rx="2.8" ry="2.2" fill="#F4C542" stroke="#2B1B12" stroke-width="2"/><ellipse cx="33.5" cy="23" rx="2.8" ry="2.2" fill="#F4C542" stroke="#2B1B12" stroke-width="2"/><ellipse cx="24" cy="12" rx="5.5" ry="2.4" fill="#7FA83A" stroke="#2B1B12" stroke-width="1.8" transform="rotate(-22 24 12)"/></svg>
          Lemon Market
        </div>
        <div class="pills">
          <span class="pill role">Verkäufer: <span class="v" id="meName">Sam</span></span>
          <span class="pill">Runde <span class="v">3</span> von 6</span>
          <span class="pill p2" id="phasePill">Phase 2</span>
          <span class="pill" id="moneyPill">Kasse <span class="v" id="money">100 €</span></span>
          <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="#2B1B12" stroke-width="2.2"/><path d="M12 9v4l2.5 2M9.5 2.5h5" stroke="#2B1B12" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span id="timerLabel">Stand wählen</span> <span class="v" id="timer">0:30</span></span>
        </div>
      </header>
      <main id="app" aria-live="off"></main>
    </div>
  </div>
  <p class="sr" aria-live="polite" id="live"></p>

  <section class="controls" aria-label="Mockup-Steuerung">
    <div>
      <h2>Mockup-Steuerung</h2>
      <small>Gehört nicht zur Spieloberfläche</small>
    </div>
    <div class="group">
      <span>Screen</span>
      <div class="seg" id="screenSeg">
        <button type="button" data-screen="1">1 Stand</button>
        <button type="button" data-screen="2">2 Kiste</button>
        <button type="button" data-screen="3">3 Preis</button>
        <button type="button" data-screen="4">4 Kaufrunde</button>
      </div>
    </div>
    <div class="group">
      <span>Phase</span>
      <div class="seg">
        <button type="button" data-phase="1">1 · offen</button>
        <button type="button" data-phase="2">2 · verdeckt</button>
      </div>
    </div>
    <div class="group" id="simGroup">
      <button type="button" class="ctl" id="simSold">Verkauf simulieren</button>
      <button type="button" class="ctl" id="simUnsold">Kein Verkauf</button>
    </div>
    <button type="button" class="ctl" id="reset">Alles zurücksetzen</button>
  </section>

function offerCard({price, q, reveal, style='', mine=false}){
  const crate = reveal
    ? `<div class="crate"><img src="${CRATES[q-1]}" alt="${QUAL[q].label}: ${QUAL[q].text}"></div>`
    : `<div class="crate"><img src="${CRATES[1]}" alt="Abgedeckte Kiste">${TARP}</div>`;
  const label = reveal
    ? `<span class="qtext q${q}">${QUAL[q].label}${mine && S.phase===2 ? ' (nur du)' : ''}</span>`
    : `<span class="qtext qunknown">Qualität ?</span>`;
  return `<div class="offer ${style}">${crate}<div><div class="price">${eur(price)}</div>${label}</div></div>`;
}

/* ---------- Screen 1: Stand wählen ---------- */
function screen1(){
  const cards = STALLS.map((s,i) => {
    const taken = TAKEN[i];
    const sel = S.stall === i;
    const bs = `background-size:${1024/206*100}% ${572/250*100}%;background-position:${s.crop/(1024-206)*100}% ${196/(572-250)*100}%`;
    return `<button type="button" class="stallcard ${taken?'taken':''}" data-stall="${i}" aria-pressed="${sel}" ${taken?'aria-disabled="true"':''}
      aria-label="${s.title}${taken ? ', vergeben an '+taken : sel ? ', ausgewählt' : ', frei'}">
      <div class="crop" style="${bs};position:relative">${s.cover ? `<span style="position:absolute;left:${(s.cover[0]-s.crop)/206*100}%;top:${(s.cover[1]-196)/250*100}%;transform:translate(-50%,-50%)">${MINI_LEMON}</span>` : ''}</div>
      <b>${s.title}</b><span>${taken ? 'Vergeben an '+taken : sel ? 'Dein Stand' : 'Frei'}</span>
    </button>`;
  }).join('');
  return `<div class="stage">
    <div class="bg" style="background-size:100% 100%;filter:brightness(.4) blur(3px) saturate(.8)"></div>
    <div class="abs sign" style="left:50%;top:4%;transform:translateX(-50%) rotate(-1deg)">
      <h1>Wähle deinen Stand</h1><p>So sehen dich die Käufer später auf dem Markt</p>
    </div>
    <div class="abs stalls">${cards}</div>
    <div class="abs" style="left:50%;bottom:5%;transform:translateX(-50%)">
      <button type="button" class="cta" data-go="2" ${S.stall===null?'aria-disabled="true"':''}>Stand übernehmen</button>
    </div>
  </div>`;
}

/* ---------- Screen 2: Kiste wählen ---------- */
function screen2(){
  const opts = [1,2,3].map(q => `
    <button type="button" class="crateopt" data-q="${q}" aria-pressed="${S.quality===q}" aria-label="${QUAL[q].label}, ${QUAL[q].text}, Einkauf ${QUAL[q].cost} Euro">
      <span class="pick">Ausgewählt</span>
      <span class="label"><b class="q${q}">${QUAL[q].label}</b><span>${QUAL[q].text}</span><span class="cost">Einkauf ${eur(QUAL[q].cost)}</span></span>
      <img src="${CRATES[q-1]}" alt="">
    </button>`).join('');
  return `<div class="stage">
    <div class="bg" style="background-size:260% 260%;background-position:100% 56%;filter:brightness(.42) blur(3px) saturate(.8)"></div>
    <div class="abs sign" style="left:50%;top:4%;transform:translateX(-50%) rotate(1deg)">
      <h1>Wähle deine Kiste</h1><p>Sortierstation · bessere Zitronen kosten mehr im Einkauf</p>
    </div>
    <div class="abs table"></div>
    <div class="abs crates">${opts}</div>
    <div class="abs hint" style="left:3%;bottom:5%">${EYE}<span>Nur du kennst die Qualität. In Phase 2 sehen Käufer nur eine abgedeckte Kiste.</span></div>
    <div class="abs" style="right:3%;bottom:4%">
      <button type="button" class="cta" data-go="3" ${S.quality===null?'aria-disabled="true"':''}>Kiste nehmen</button>
    </div>
  </div>`;
}

/* ---------- Screen 3: Hinter der Theke ---------- */
function ledgerHTML(){
  const c = cost(), gain = S.price - c;
  const hist = HISTORY.map(h => {
    const res = h.sold ? h.price - QUAL[h.q].cost : -QUAL[h.q].cost;
    return `<span>R${h.r}</span><span class="q${h.q}">Q${h.q}</span><span>${eur(h.price)}</span><span class="${res>=0?'pos':'neg'}">${h.sold?'verkauft':'übrig'} ${signed(res)}</span>`;
  }).join('');
  return `<h2>Kassenbuch</h2>
    <div class="lrow"><span>Kiste</span><b class="q${S.quality}">${QUAL[S.quality].label}</b></div>
    <div class="lrow"><span>Einkauf</span><b class="neg">${signed(-c)}</b></div>
    <div class="lrow"><span>Dein Preis</span><b>${eur(S.price)}</b></div>
    <div class="lrow total"><span>Wenn verkauft</span><b class="${gain>=0?'pos':'neg'}" id="gain">${signed(gain)}</b></div>
    <div class="lrow"><span>Wenn nicht verkauft</span><b class="neg">${signed(-c)}</b></div>
    <h3>Letzte Runden</h3>
    <div class="hist">${hist}</div>`;
}
function screen3(){
  const q = S.quality;
  const market = [1,2,3].map(k => `<div class="mrow"><img src="${CRATES[k-1]}" alt=""><span class="q${k}" style="color:${['#B9E28A','#F4D46A','#F4A58A'][k-1]}">Q${k}</span><span class="avg">Ø ${eur(MARKET_LAST[k])}</span></div>`).join('');
  return `<div class="stage">
    <div class="bg" style="background-size:135% 135%;background-position:31% 69%;filter:brightness(.55) blur(2.5px)"></div>

    <div class="abs chalkboard nail board-market">
      <h2>Marktpreise</h2>
      <p class="sub">Durchschnitt aus Runde 2</p>
      ${market}
      <div class="mfoot">Alle Stände Ø ${eur(MARKET_LAST.all)} · ${MARKET_LAST.sold} von ${MARKET_LAST.total} verkauft</div>
    </div>

    <div class="abs chalkboard nail board-price">
      <h2>Dein Preis</h2>
      <p class="sub">Schreib ihn auf die Tafel</p>
      <div class="pricewrap">
        <label for="priceInput" class="sr">Preis in Euro</label>
        <input id="priceInput" type="number" inputmode="numeric" min="1" max="99" value="${S.price}">
        <span class="eur">€</span>
      </div>
      <div class="pegs">
        <button type="button" class="peg" data-step="-5" aria-label="5 Euro weniger">−5</button>
        <button type="button" class="peg" data-step="-1" aria-label="1 Euro weniger">−1</button>
        <button type="button" class="peg" data-step="1" aria-label="1 Euro mehr">+1</button>
        <button type="button" class="peg" data-step="5" aria-label="5 Euro mehr">+5</button>
      </div>
      <div class="warn" id="warn"></div>
    </div>

    <div class="abs ledger" id="ledger">${ledgerHTML()}</div>

    <div class="abs counter" aria-hidden="true">
      <svg viewBox="0 0 1024 166" preserveAspectRatio="none">
        <rect x="-4" y="10" width="1032" height="160" fill="#8B5A2B" stroke="#2B1B12" stroke-width="3" vector-effect="non-scaling-stroke"/>
        <rect x="-4" y="0" width="1032" height="20" fill="#A56D38" stroke="#2B1B12" stroke-width="3" vector-effect="non-scaling-stroke"/>
        <path d="M0 64 H1024 M0 112 H1024 M180 20 V64 M520 64 V112 M860 20 V64 M340 112 V166 M720 112 V166" stroke="#6B4226" stroke-width="3" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="abs crate-on"><span class="tag q${q}">${QUAL[q].label}</span><img src="${CRATES[q-1]}" alt="Deine Kiste: ${QUAL[q].label}"></div>
    <div class="abs preview" id="preview"><small>So sehen dich Käufer in Phase ${S.phase}:</small>${offerCard({price:S.price, q, reveal:S.phase===1})}</div>
    <div class="abs hang"><button type="button" class="cta" data-go="4">Schild aufhängen</button></div>
    <div class="abs cashbox" aria-hidden="true">
      <svg viewBox="0 0 120 90">
        <ellipse cx="34" cy="20" rx="12" ry="4" fill="#E9B949" stroke="#2B1B12" stroke-width="2"/>
        <ellipse cx="34" cy="15" rx="12" ry="4" fill="#E9B949" stroke="#2B1B12" stroke-width="2"/>
        <ellipse cx="34" cy="10" rx="12" ry="4" fill="#F2CB63" stroke="#2B1B12" stroke-width="2"/>
        <path d="M8 34 L112 34 L106 86 L14 86 Z" fill="#5E6B73" stroke="#2B1B12" stroke-width="3" stroke-linejoin="round"/>
        <rect x="4" y="24" width="112" height="14" rx="3" fill="#7D8B93" stroke="#2B1B12" stroke-width="3"/>
        <rect x="46" y="54" width="28" height="12" rx="3" fill="#C9D1D6" stroke="#2B1B12" stroke-width="2.5"/>
      </svg>
    </div>
  </div>`;
}
function updatePrice(v){
  S.price = Math.max(1, Math.min(99, Math.round(Number(v) || 1)));
  const inp = $('priceInput'); if (inp && document.activeElement !== inp) inp.value = S.price;
  $('ledger').innerHTML = ledgerHTML();
  $('preview').innerHTML = `<small>So sehen dich Käufer in Phase ${S.phase}:</small>${offerCard({price:S.price, q:S.quality, reveal:S.phase===1})}`;
  const c = cost();
  $('warn').textContent = S.price < c ? `Unter deinem Einkauf (${eur(c)}), du machst Verlust` : S.price > MARKET_LAST.all * 2 ? 'Deutlich über dem Marktschnitt' : '';
}

/* ---------- Screen 4: Kaufrunde ---------- */
function screen4(){
  let h = `<div class="stage"><div class="bg" style="inset:0;background-size:100% 100%"></div>
    <div class="abs ribbon">${EYE}<span>Kaufrunde läuft: Du siehst alle Preise, kaufen können nur Käufer</span></div>`;
  let o = 0;
  STALLS.forEach((slot, i) => {
    const mine = i === S.stall;
    const d = mine ? {name:ME, price:S.price, q:S.quality, sold:S.result==='sold'} : OTHERS[o++];
    const n = slot.name;
    h += `<div class="abs name ${n.style||''} ${mine && !n.style ? 'me':''}" style="${box(n.b)};--r:${n.r}deg"><small>${mine?'Dein Stand':'Stand'}</small><b>${d.name}</b></div>`;
    if (slot.cover) h += `<div class="abs cover-lemon" style="${at(slot.cover[0],slot.cover[1])}">${MINI_LEMON}</div>`;
    if (mine) h += `<div class="abs metag" style="${at(n.b[0]+n.b[2]/2, n.b[1]-14)}">Du</div>`;
    const reveal = mine || S.phase === 1;
    h += `<div class="abs pos-offer" id="${mine?'myOffer':''}" style="${at(slot.offer.x,slot.offer.y)};--r:${slot.offer.r}deg">${offerCard({price:d.price, q:d.q, reveal, style:slot.offer.style||'', mine})}</div>`;
    if (mine && S.result === 'sold') h += `<div class="abs stamp good ${S.stampFresh?'fresh':''}" style="${at(slot.offer.x,slot.offer.y)}">Verkauft!</div>`;
    if (mine && S.result === 'unsold') h += `<div class="abs stamp gray ${S.stampFresh?'fresh':''}" style="${at(slot.offer.x,slot.offer.y)}">Nicht verkauft</div>`;
    if (!mine && d.sold) h += `<div class="abs stamp" style="${at(slot.offer.x,slot.offer.y)}">Verkauft</div>`;
    let chip;
    if (mine) chip = S.result==='sold' ? `<span class="chip me sold abs" style="${at(slot.cx,498)}">${signed(S.price - cost())} Gewinn</span>`
                   : S.result==='unsold' ? `<span class="chip unsold abs" style="${at(slot.cx,498)}">${signed(-cost())}</span>`
                   : `<span class="chip me abs" style="${at(slot.cx,498)}">Wartet auf Käufer<span class="dots"></span></span>`;
    else chip = `<span class="chip abs ${d.sold?'sold':''}" style="${at(slot.cx,498)}">${d.sold?'Verkauft':'Offen'}</span>`;
    h += chip;
  });
  if (S.toast) h += `<div class="abs toast">${S.toast}</div>`;
  return h + `</div>`;
}

/* ---------- Render ---------- */
const TIMERS = {1:['Stand wählen',30],2:['Kiste wählen',20],3:['Preis setzen',30],4:['Kaufrunde',45]};
let t = 30;
function render(){
  if (S.screen >= 2 && S.stall === null) S.stall = 0;
  if (S.screen >= 3 && S.quality === null) S.quality = 2;
  const app = $('app');
  app.innerHTML = [null, screen1, screen2, screen3, screen4][S.screen]();
  if (S.screen === 3) updatePrice(S.price);
  $('money').textContent = eur(money());
  const pp = $('phasePill');
  pp.className = 'pill ' + (S.phase===1 ? 'p1':'p2');
  pp.textContent = S.phase===1 ? 'Phase 1: Qualität sichtbar' : 'Phase 2: Qualität verdeckt';
  document.querySelectorAll('[data-screen]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.screen === S.screen)));
  document.querySelectorAll('[data-phase]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.phase === S.phase)));
  $('simGroup').style.visibility = S.screen === 4 ? 'visible' : 'hidden';
  S.stampFresh = false;
}
function go(n){
  S.screen = n; S.result = null; S.toast = null;
  t = TIMERS[n][1]; $('timerLabel').textContent = TIMERS[n][0]; tick();
  render();
  $('live').textContent = `${TIMERS[n][0]}`;
}
function tick(){ $('timer').textContent = `0:${String(t).padStart(2,'0')}`; }
setInterval(() => { t = t <= 0 ? TIMERS[S.screen][1] : t - 1; tick(); }, 1000);

function flyCoins(){
  const from = $('myOffer'), to = $('moneyPill');
  if (!from || !to || matchMedia('(prefers-reduced-motion: reduce)').matches) { bumpMoney(); return; }
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  const sx = a.left + a.width/2, sy = a.top + a.height/2, ex = b.left + b.width/2, ey = b.top + b.height/2;
  for (let i = 0; i < 7; i++) {
    const c = document.createElement('div'); c.className = 'coin'; c.innerHTML = COIN;
    document.body.appendChild(c);
    const jx = (Math.random()-.5)*60, jy = -40 - Math.random()*50;
    c.animate([
      {transform:`translate(${sx-11}px,${sy-11}px) scale(.6)`, opacity:0},
      {transform:`translate(${sx-11+jx}px,${sy-11+jy}px) scale(1)`, opacity:1, offset:.3},
      {transform:`translate(${ex-11}px,${ey-11}px) scale(.7)`, opacity:1}
    ], {duration:900, delay:i*70, easing:'cubic-bezier(.5,0,.3,1)', fill:'forwards'})
     .onfinish = () => { c.remove(); if (i === 6) bumpMoney(); };
  }
}
function bumpMoney(){ const p = $('moneyPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }

/* ---------- Events ---------- */
$('app').addEventListener('click', e => {
  const stall = e.target.closest('[data-stall]');
  if (stall && !stall.hasAttribute('aria-disabled')) { S.stall = +stall.dataset.stall; render(); $('live').textContent = `${STALLS[S.stall].title} ausgewählt`; return; }
  const crate = e.target.closest('[data-q]');
  if (crate) { S.quality = +crate.dataset.q; render(); $('live').textContent = `${QUAL[S.quality].label} ausgewählt, Einkauf ${QUAL[S.quality].cost} Euro`; return; }
  const peg = e.target.closest('[data-step]');
  if (peg) { updatePrice(S.price + +peg.dataset.step); $('live').textContent = `Preis ${S.price} Euro`; return; }
  const g = e.target.closest('[data-go]');
  if (g && g.getAttribute('aria-disabled') !== 'true') go(+g.dataset.go);
});
$('app').addEventListener('input', e => { if (e.target.id === 'priceInput') updatePrice(e.target.value); });
$('app').addEventListener('change', e => { if (e.target.id === 'priceInput') { e.target.value = S.price; } });

document.querySelectorAll('[data-screen]').forEach(b => b.addEventListener('click', () => go(+b.dataset.screen)));
document.querySelectorAll('[data-phase]').forEach(b => b.addEventListener('click', () => { S.phase = +b.dataset.phase; render(); }));
$('simSold').addEventListener('click', () => {
  if (S.screen !== 4 || S.result) return;
  S.result = 'sold'; S.stampFresh = true;
  S.toast = `Ein Käufer hat deine Zitronen gekauft: ${signed(S.price)} Einnahme, ${signed(S.price - cost())} Gewinn`;
  render(); flyCoins();
  $('live').textContent = S.toast;
});
$('simUnsold').addEventListener('click', () => {
  if (S.screen !== 4 || S.result) return;
  S.result = 'unsold'; S.stampFresh = true;
  S.toast = `Runde vorbei, deine Kiste bleibt liegen: ${signed(-cost())}`;
  render(); $('live').textContent = S.toast;
});
$('reset').addEventListener('click', () => { S = fresh(); go(1); });

$('meName').textContent = ME;
go(1);
</script>
</body>
</html>
